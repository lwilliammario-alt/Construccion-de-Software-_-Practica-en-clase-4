<!-- Declara que el documento usa el estándar HTML5 -->
<!doctype html>
<!-- Define el idioma del contenido de la página (inglés); se puede cambiar a "es" para español -->
<html lang="es">
  <head>
    <!-- Establece la codificación de caracteres UTF-8 para soportar acentos y caracteres especiales -->
    <meta charset="UTF-8" />

    <!-- Define el ícono (favicon) que aparece en la pestaña del navegador -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Configura el viewport para que la página sea responsive en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título de la página que aparece en la pestaña del navegador -->
    <title>ConstruSoft Ticket</title>
  </head>
  <body>
    <!-- Contenedor raíz donde React montará toda la aplicación de forma dinámica -->
    <div id="root"></div>

    <!-- Carga el punto de entrada de la aplicación React como módulo ES (permite imports) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
